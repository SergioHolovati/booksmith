# Segredos NUNCA ficam neste arquivo. Em desenvolvimento, copie .env.example para .env (fora do git).
spring:
  application:
    name: booksmith
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booksmith}
    username: ${SPRING_DATASOURCE_USERNAME:booksmith}
    password: ${SPRING_DATASOURCE_PASSWORD:booksmith}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # o esquema é das migrações Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Importação de .docx (§9.3): um romance inteiro em .docx raramente passa de 2 MB
      max-file-size: 15MB
      max-request-size: 16MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

server:
  # 8090, não 8080: a 8080 costuma estar ocupada por outros projetos na mesma máquina
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # %replace tira quebras de linha da mensagem: um texto do usuário no log não consegue forjar linhas falsas
    # (CRLF injection). A pilha de erro (%ex) continua em várias linhas, como deve.
    # No YAML entre aspas duplas, \\r vira \r para o logback (a expressão [\r\n]+)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestTraceId : %X{requestTraceId:-} - %replace(%msg){'[\\r\\n]+',' | '}%n"

booksmith:
  # Corretor próprio (§8.5, etapa 2): o container spellcheck do docker-compose (LanguageTool)
  spellcheck:
    url: ${SPELLCHECK_URL:http://localhost:8081}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: PT1H
    # Sessão longa e renovada a cada uso: quem escreve no celular não deve precisar entrar toda hora
    session-ttl: P30D
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:300}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
  identity:
    minimum-age: 13
  # Beta fechado: criar conta exige código de convite. Desligue (false) quando o Booksmith abrir para todos.
  invites:
    required: ${INVITE_REQUIRED:true}
  # Chave (32 bytes em base64) que criptografa segredos guardados no banco: segredo do MFA, acesso ao Google Drive.
  # Vazia em desenvolvimento: deriva do jwt-secret. Em produção, defina a sua e guarde fora do banco.
  crypto:
    key: ${CRYPTO_KEY:}
  # Sugestões e revisão de IA (§4.11): anthropic (API do Claude) ou off. Sem ANTHROPIC_API_KEY, a IA fica desligada.
  ai:
    provider: ${AI_PROVIDER:anthropic}
    # Usos de IA por pessoa a cada 24 horas: uma revisão completa, um pedido de ideias ou uma pergunta conta um
    daily-limit: ${AI_DAILY_LIMIT:3}
    concurrency: ${AI_CONCURRENCY:4}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # Haiku: o mais barato (~R$ 0,04 por revisão completa); trocar de modelo é só configurar
      model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
  mail:
    enabled: ${MAIL_ENABLED:true}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:Booksmith <no-reply@booksmith.com.br>}
  media:
    bucket: ${MEDIA_BUCKET:booksmith-media}
    region: ${AWS_REGION:sa-east-1}
    endpoint: ${MEDIA_S3_ENDPOINT:}
    access-key: ${MEDIA_S3_ACCESS_KEY:}
    secret-key: ${MEDIA_S3_SECRET_KEY:}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:https://media.booksmith.com.br}
    max-image-size: 5MB

---
spring:
  config:
    activate:
      on-profile: dev

# Só saúde e informação, também em desenvolvimento: com "*", qualquer conta criada lia /actuator/env e
# /actuator/beans (achado do Semgrep, 2026-11-10; os valores sensíveis vinham mascarados).
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Em desenvolvimento a API só ouve o próprio PC: o celular chega pelo proxy do app (que roda no PC). Assim a
# rede de casa não enxerga a API direto.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

booksmith:
  security:
    # Segredo só para desenvolvimento local; staging e produção exigem JWT_SECRET
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    # Folgado em dev: os testes de integração (booksmith-tests) cadastram muitos usuários do mesmo IP
    rate-limit:
      general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:3000}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:600}
  mail:
    enabled: ${MAIL_ENABLED:false}   # e-mails vão para o log
  media:
    bucket: ${MEDIA_BUCKET:booksmith}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_S3_ACCESS_KEY:booksmith}
    secret-key: ${MEDIA_S3_SECRET_KEY:booksmith123}
    # Relativa: o dev server do app faz proxy de /media para o MinIO, então as imagens abrem também no celular
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:/media}

---
spring:
  config:
    activate:
      on-profile: stage,prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
