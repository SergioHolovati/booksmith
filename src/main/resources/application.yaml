management:
  endpoints:
    web:
      exposure:
        include: "health,info"
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestTraceId : %X{requestTraceId:-} - %msg%n"
aws:
  access-key: ${AWS_ACCESS_KEY_ID:booksmith}
  secret-key: ${AWS_SECRET_ACCESS_KEY:booksmith123}
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:booksmith}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}

spring:
  application:
    name: booksmith
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booksmith}
    username: ${SPRING_DATASOURCE_USERNAME:booksmith}
    password: ${SPRING_DATASOURCE_PASSWORD:booksmith}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1020269223097-i1tda5amo94d4gv3ao2tcl9etccj18f7.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
api:
  security:
    token:
      secret: ${TOKEN_SECRET:token}
      expiration: ${EXPIRATION:86400000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4200,http://127.0.0.1:4200}

resend:
  api-key: ${RESEND_API_KEY:re_cc9NN4HF_79dgFNFV6QKaheGgKv6HhfGx}
  from-email: onboarding@booksmith.com
