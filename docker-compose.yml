name: booksmith

# Dados de desenvolvimento que importam (livros escritos de verdade enquanto o app é testado):
# - Postgres e MinIO usam volumes EXTERNOS: "docker compose down -v" não os apaga.
#   Crie uma vez com:  docker volume create booksmith_postgres-data && docker volume create booksmith_minio-data
# - backup-db e backup-media copiam banco e imagens para uma pasta do Windows (fora do Docker),
#   que sobrevive até a um "Purge data" ou reinstalação do Docker Desktop. Ver scripts/backup.ps1 e restore.ps1.
# - restart: always faz tudo voltar sozinho quando o Docker reinicia ("unless-stopped" NÃO volta: para o
#   Docker, o desligamento do Docker Desktop conta como parada do container).

x-backup-dir: &backup-dir ${BOOKSMITH_BACKUP_DIR:-../booksmith-data/backups}

services:
  postgres:
    # pgvector já incluso: será usado pelo agente de continuidade (§10)
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: booksmith
      POSTGRES_USER: booksmith
      POSTGRES_PASSWORD: booksmith
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksmith -d booksmith"]
      interval: 5s
      retries: 10

  redis:
    # Só sessões de login: pode ser perdido sem prejuízo (no máximo, entrar de novo)
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    # S3 local para capas e avatares
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: booksmith
      MINIO_ROOT_PASSWORD: booksmith123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-setup:
    # Cria o bucket e libera leitura pública (só em desenvolvimento)
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 booksmith booksmith123 &&
      mc mb --ignore-existing local/booksmith &&
      mc anonymous set download local/booksmith
      "

  backup-db:
    # Dump do banco ao subir e a cada 6 horas; mantém 30 dias
    image: pgvector/pgvector:pg17
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo   # nomes dos arquivos no horário local
      PGHOST: postgres
      PGUSER: booksmith
      PGPASSWORD: booksmith
      PGDATABASE: booksmith
    volumes:
      - type: bind
        source: *backup-dir
        target: /backups
    entrypoint: >
      /bin/sh -c '
      mkdir -p /backups/postgres;
      while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        if pg_dump -Fc -f /backups/postgres/booksmith-$$ts.dump.tmp; then
          mv /backups/postgres/booksmith-$$ts.dump.tmp /backups/postgres/booksmith-$$ts.dump;
          echo "backup ok: booksmith-$$ts.dump";
        else
          rm -f /backups/postgres/booksmith-$$ts.dump.tmp;
          echo "backup FALHOU";
        fi;
        find /backups/postgres -name "booksmith-*.dump" -mtime +30 -delete;
        sleep 21600;
      done'

  backup-media:
    # Espelha capas e avatares do MinIO a cada 6 horas
    image: minio/mc:latest
    restart: always
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: *backup-dir
        target: /backups
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 booksmith booksmith123 >/dev/null;
      mkdir -p /backups/media;
      while true; do
        mc mirror --overwrite --quiet local/booksmith /backups/media && echo "backup de mídia ok";
        sleep 21600;
      done'

  spellcheck:
    # Corretor próprio (§8.5, etapa 2): LanguageTool oficial, imagem construída aqui (docker/languagetool).
    # Só a API fala com ele: a porta fica presa a 127.0.0.1 (nem a rede de casa enxerga). 8081, não 8080.
    build: ./docker/languagetool
    image: booksmith-spellcheck:6.6
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 1536m

  app:
    build: .
    profiles: ["app"]   # suba com: docker compose --profile app up --build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksmith
      SPRING_DATA_REDIS_HOST: redis
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/booksmith
    ports:
      - "8090:8090"

volumes:
  postgres-data:
    external: true
    name: booksmith_postgres-data
  minio-data:
    external: true
    name: booksmith_minio-data
  redis-data:
