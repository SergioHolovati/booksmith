# Booksmith em produção (beta) num único VPS.
#
# Layout no servidor: /opt/booksmith/.env (segredos, fora do Git), /opt/booksmith/src/booksmith e
# /opt/booksmith/src/booksmith-web (código commitado, enviado pelo scripts\deploy.ps1), /opt/booksmith/backups.
#
# Subir: docker compose --env-file /opt/booksmith/.env -f /opt/booksmith/src/booksmith/deploy/compose.prod.yml up -d --build
# (o deploy/deploy.sh faz isso, com backup antes e volta atrás se a API não subir).
#
# Só o Caddy publica portas (80 e 443). Postgres, Redis, MinIO, corretor e API falam entre si na rede interna do
# Docker: nada deles é alcançável de fora. Imagens com versão fixa: atualizar é uma decisão, não um acidente.
name: booksmith

x-env-file: &env-file
  - path: ../../../.env   # /opt/booksmith/.env, relativo a este arquivo
    required: true

services:
  # ---- Entrada: HTTPS automático, app estático e proxy da API ----
  caddy:
    build:
      context: ../../booksmith-web
    image: booksmith-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-booksmith-media}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---- API ----
  api:
    build:
      context: ..
    image: booksmith-api:latest
    restart: unless-stopped
    env_file: *env-file
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booksmith
      SPRING_DATASOURCE_USERNAME: booksmith
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPELLCHECK_URL: http://spellcheck:8081
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-booksmith-media}
      MEDIA_PUBLIC_BASE_URL: https://${SITE_ADDRESS}/media
      FRONTEND_URL: https://${SITE_ADDRESS}
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+UseSerialGC"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      spellcheck:
        condition: service_started
    healthcheck:
      # A imagem não tem curl; o bash do Ubuntu fala HTTP pelo /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *logging

  # ---- Dados ----
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: booksmith
      POSTGRES_USER: booksmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksmith -d booksmith"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1024m
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Sessões e contadores de segurança moram aqui: nunca descartar chaves por falta de memória (noeviction)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    logging: *logging

  # MinIO: o projeto retirou as imagens públicas do Docker Hub e do quay.io (2025). As do servidor vêm do notebook
  # (docker save | docker load; as mesmas de desenvolvimento), por isso pull_policy: never. É transitório: as
  # imagens dos autores vão para o Cloudflare R2 (S3), e o MinIO sai do servidor.
  minio:
    image: minio/minio:latest
    pull_policy: never
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  minio-setup:
    # Cria o bucket das imagens com leitura pública (as imagens são servidas pelo Caddy em /media)
    image: minio/mc:latest
    pull_policy: never
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MEDIA_BUCKET &&
      mc anonymous set download local/$$MEDIA_BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-booksmith-media}

  # ---- Corretor (LanguageTool 6.6), a peça mais pesada ----
  spellcheck:
    build: ../docker/languagetool
    image: booksmith-spellcheck:6.6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *logging

  # ---- Cópias de segurança no próprio servidor (a cópia fora, no R2, entra em seguida: ver deploy/README.md) ----
  backup-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: booksmith
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: booksmith
    volumes:
      - /opt/booksmith/backups:/backups
    entrypoint: >
      /bin/sh -c "
      mkdir -p /backups/postgres;
      while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        if pg_dump -Fc -f /backups/postgres/booksmith-$$ts.dump.tmp; then
          mv /backups/postgres/booksmith-$$ts.dump.tmp /backups/postgres/booksmith-$$ts.dump;
          echo \"backup ok: booksmith-$$ts.dump\";
        else
          rm -f /backups/postgres/booksmith-$$ts.dump.tmp;
          echo \"backup FALHOU\";
        fi;
        find /backups/postgres -name 'booksmith-*.dump' -mtime +30 -delete;
        sleep 21600;
      done
      "
    logging: *logging

  backup-media:
    image: minio/mc:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-booksmith-media}
    volumes:
      - /opt/booksmith/backups:/backups
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null;
      mkdir -p /backups/media;
      while true; do
        if mc mirror --overwrite local/$$MEDIA_BUCKET /backups/media >/dev/null; then echo \"espelho das imagens ok\"; else echo \"espelho das imagens FALHOU\"; fi;
        sleep 86400;
      done
      "
    logging: *logging

  # Cópia fora do servidor: criptografada (age, chave pública) e enviada ao Cloudflare R2 (rclone). Confere a cada
  # hora: dump novo do banco vai na hora; as imagens, uma vez por dia. A chave privada nunca está no servidor.
  backup-offsite:
    build: ./backup-offsite
    image: booksmith-backup-offsite:latest
    restart: unless-stopped
    environment:
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET:-booksmith-backups}
      HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - /opt/booksmith/backups:/backups
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
